# Builds a universal macOS DMG and attaches it to a draft GitHub Release when a version tag is pushed.
#
#   1. scripts/release.sh 0.2.0   (bumps the version in the root Cargo.toml, runs the checks, commits, tags, pushes)
#   2. Review the draft release this workflow creates, with notes generated from the commits, then publish it.
#
# Running it by hand (Actions → Release → Run workflow) is a dry run: it builds the DMG and keeps it as a workflow
# artifact, without creating a release.
#
# Signing and notarization run only when the Apple secrets below are set. Without them the DMG is unsigned and
# Gatekeeper blocks it on download, which a security app shouldn't ask its users to bypass, so set them before
# publishing a release for anyone else.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install front-end dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # The same gate as before every commit: a release must not ship failing tests, warnings or untranslated text
      - name: Test
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --locked -- -D warnings
          cd app && pnpm exec tsc --noEmit && pnpm -s check:i18n

      # GitHub sets missing secrets to empty strings, and Tauri treats an empty APPLE_CERTIFICATE as a certificate
      # to import, so only export the signing variables when they are really there.
      - name: Signing environment
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              eval "value=\$$name"
              echo "::add-mask::$value"
              echo "$name=$value" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::Apple signing secrets are not set: the DMG will be unsigned and not notarized."
          fi

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          # Empty on a dry run, so nothing is released
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: Tsuba ${{ github.ref_name }}
          releaseBody: Generating release notes…
          releaseDraft: true
          prerelease: false

      # Checksums so anyone can confirm the DMG they downloaded is the one this workflow built from the public source
      - name: Checksums
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd target/universal-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      # GitHub writes the notes from the commits and pull requests since the previous release. An unsigned build says so
      # first, and says how to open it without removing the quarantine flag: Tsuba itself warns about installers that
      # ask for that, so its own release must not.
      - name: Release notes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            notice=$(cat <<'NOTICE'
          > [!WARNING]
          > **This build is not signed or notarized by Apple yet.** macOS blocks it the first time you open it: go to **System Settings → Privacy & Security** and click **Open Anyway**.
          >
          > Tsuba is open source, so you can check what you run: compare the DMG with `SHA256SUMS.txt` below (`shasum -a 256 Tsuba_*.dmg`), read the workflow that built it, or build it yourself (see the README).
          >
          > Please don't remove the quarantine flag with `xattr`: Tsuba warns about installers that ask you to, and its own shouldn't be the exception.
          >
          > **尚未经过 Apple 签名和公证。** 第一次打开会被 macOS 拦下：到 **系统设置 → 隐私与安全性** 点 **仍要打开**。Tsuba 是开源的：可以用下面的 `SHA256SUMS.txt` 核对 DMG，或按 README 自己构建。请不要用 `xattr` 删除隔离标记，Tsuba 自己就会拦截要求你这么做的安装包。
          NOTICE
            )
            notes=$(printf '%s\n\n%s' "$notice" "$notes")
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f body="$notes" > /dev/null

      - name: Keep the dry-run DMG
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Tsuba-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7
