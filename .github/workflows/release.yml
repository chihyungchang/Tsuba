# Builds macOS DMGs into a GitHub Release when a version tag is pushed, and publishes it once every job has passed.
#
#   scripts/release.sh 0.2.0   (sets the version in the root Cargo.toml, runs the checks, commits, tags, pushes)
#
# The release stays a draft while building so nobody downloads, and no installed copy updates to, a half-uploaded one.
#
# The tests and the two architectures run on separate runners at the same time: a universal build compiled both
# architectures one after the other on one 3-core runner and took over 40 minutes. If any job fails, the draft is
# deleted (the tag stays), so a release is never left half built or built from code that failed its tests.
#
# Running it by hand (Actions → Release → Run workflow) is a dry run: it tests and builds, keeping the DMGs as workflow
# artifacts, without creating a release.
#
# In-app update packages and latest.json are made only when the TAURI_SIGNING_PRIVATE_KEY secret is set.
#
# Signing and notarization run only when the Apple secrets below are set. Without them the DMG is unsigned and the
# release notes say so, with how to open and verify it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      # Created up front so both build jobs upload to the same draft instead of racing to create it.
      # Drafts can't be looked up by tag, so everything after this goes by the release ID.
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" -f name="Tsuba $GITHUB_REF_NAME" \
            -f body="Building…" -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # The same gate as before every commit: a release must not ship failing tests, warnings or untranslated text
  test:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install front-end dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      # setup-node installs node under the home folder, which the sandbox hides. Homebrew's node is on the runner too,
      # so sandbox_runs_npm_installed_in_home also covers npm crashing when a hidden folder sat ahead of it in PATH.
      - name: Test
        run: |
          cargo test --workspace --locked
          cargo clippy --workspace --locked -- -D warnings
          cd app && pnpm exec tsc --noEmit && pnpm -s check:i18n

  build:
    needs: release
    # Also runs on a dry run, when the release job is skipped
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: Apple silicon
          - target: x86_64-apple-darwin
            name: Intel
    name: build (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Install front-end dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # GitHub sets missing secrets to empty strings, and Tauri treats an empty APPLE_CERTIFICATE as a certificate
      # to import, so only export the signing variables when they are really there.
      - name: Signing environment
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              eval "value=\$$name"
              echo "::add-mask::$value"
              echo "$name=$value" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::Apple signing secrets are not set: the DMG will be unsigned and not notarized."
          fi

      # In-app updates: with the updater key set, the build also makes a signed Tsuba.app.tar.gz that installed copies
      # download and verify against the public key in tauri.conf.json. Without it, releases work as before but installed
      # copies won't see them as updates. The key has no password; an empty one must still be set or the signer prompts.
      - name: Updater signing environment
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::add-mask::$TAURI_SIGNING_PRIVATE_KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY=$TAURI_SIGNING_PRIVATE_KEY" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
            echo "UPDATER_CONFIG=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: no update packages, so installed copies won't update to this release."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json ${{ env.UPDATER_CONFIG }}
          # Empty on a dry run, so nothing is uploaded to a release
          releaseId: ${{ needs.release.outputs.id }}
          # The two architectures build at the same time and would overwrite each other's latest.json; the finish job
          # writes one with both once they are done
          includeUpdaterJson: false

      - name: Checksum
        run: |
          cd target/${{ matrix.target }}/release/bundle/dmg
          shasum -a 256 *.dmg | tee "$RUNNER_TEMP/sha256-${{ matrix.target }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.target }}
          path: ${{ runner.temp }}/sha256-${{ matrix.target }}.txt

      - name: Keep the dry-run DMG
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Tsuba-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          retention-days: 7

  finish:
    needs: [release, test, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.release.outputs.id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          merge-multiple: true

      # tauri-action also uploads each Tsuba.app as a .tar.gz. With a signature next to it, it is the in-app update
      # package: latest.json points installed copies at it. Without one (no updater key) nothing can use it, so it goes.
      - name: Update manifest
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets[] | [.id, .name] | @tsv')
          if ! echo "$assets" | grep -q '\.app\.tar\.gz\.sig$'; then
            echo "$assets" | awk -F'\t' '$2 ~ /\.app\.tar\.gz$/ {print $1}' |
              while read -r asset; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"; done
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          platforms='{}'
          while IFS=$'\t' read -r id name; do
            case "$name" in *.app.tar.gz.sig) ;; *) continue ;; esac
            case "$name" in *aarch64*) platform=darwin-aarch64 ;; *x64*|*x86_64*) platform=darwin-x86_64 ;; *) continue ;; esac
            signature=$(gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id")
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/${name%.sig}"
            platforms=$(jq --arg p "$platform" --arg s "$signature" --arg u "$url" '. + {($p): {signature: $s, url: $u}}' <<< "$platforms")
          done <<< "$assets"
          if [ "$(jq 'length' <<< "$platforms")" != 2 ]; then
            echo "::error::Expected update packages for both architectures, found: $(jq -c 'keys' <<< "$platforms")"
            exit 1
          fi
          jq -n --arg v "$version" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, notes: "", pub_date: $d, platforms: $p}' > latest.json
          cat latest.json
          gh api --method POST -H "Content-Type: application/json" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" \
            --input latest.json > /dev/null

      # Checksums so anyone can confirm the DMG they downloaded is the one this workflow built from the public source
      - name: Checksums
        run: |
          cat sha256-*.txt | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh api --method POST -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=SHA256SUMS.txt" \
            --input SHA256SUMS.txt > /dev/null

      # GitHub writes the notes from the commits and pull requests since the previous release. An unsigned build says so
      # first, and says how to open it without removing the quarantine flag: Tsuba itself warns about installers that
      # ask for that, so its own release must not.
      - name: Release notes
        env:
          IS_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          download=$(cat <<'DOWNLOAD'
          **Download:** `Tsuba_*_aarch64.dmg` for Apple silicon Macs (M1 and later), `Tsuba_*_x64.dmg` for Intel Macs. Not sure? Apple menu → About This Mac → Chip.

          **下载：**Apple 芯片的 Mac（M1 及以后）选 `aarch64`，Intel 芯片选 `x64`。不确定的话：苹果菜单 → 关于本机 → 芯片。
          DOWNLOAD
          )
          notes=$(printf '%s\n\n%s' "$download" "$notes")
          if [ "$IS_SIGNED" != true ]; then
            notice=$(cat <<'NOTICE'
          > [!WARNING]
          > **This build is not signed or notarized by Apple yet.** macOS blocks it the first time you open it: go to **System Settings → Privacy & Security** and click **Open Anyway**.
          >
          > Tsuba is open source, so you can check what you run: compare the DMG with `SHA256SUMS.txt` below (`shasum -a 256 Tsuba_*.dmg`), read the workflow that built it, or build it yourself (see the README).
          >
          > Please don't remove the quarantine flag with `xattr`: Tsuba warns about installers that ask you to, and its own shouldn't be the exception.
          >
          > **尚未经过 Apple 签名和公证。** 第一次打开会被 macOS 拦下：到 **系统设置 → 隐私与安全性** 点 **仍要打开**。Tsuba 是开源的：可以用下面的 `SHA256SUMS.txt` 核对 DMG，或按 README 自己构建。请不要用 `xattr` 删除隔离标记，Tsuba 自己就会拦截要求你这么做的安装包。
          NOTICE
            )
            notes=$(printf '%s\n\n%s' "$notice" "$notes")
          fi
          # Uploads leave the draft showing "untagged-…": set the tag again so publishing uses the pushed tag
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f body="$notes" -f tag_name="$GITHUB_REF_NAME" > /dev/null

      - name: Publish
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false > /dev/null

  # A release published with GITHUB_TOKEN doesn't fire site.yml's `published` trigger (GitHub never lets that token
  # start other workflows), so the website rebuild is called from here.
  website:
    needs: finish
    uses: ./.github/workflows/site.yml
    secrets: inherit

  # A failed test or build leaves no draft behind: re-pushing the tag (or fixing and tagging a new version) starts clean
  discard:
    needs: [release, test, build, finish]
    if: ${{ failure() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.id }}"
