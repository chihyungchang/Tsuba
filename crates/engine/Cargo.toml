[package]
name = "tsuba-engine"
description = "Tsuba detection engine: checks unfamiliar code before it first runs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex = "1"
shlex = "1"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
plist = "1"
tempfile = "3"
yara-x = "1.22.1"
flate2 = "1.1.10"
tar = "0.4.46"
toml = "1.1.8"
libc = "0.2.191"
ed25519-dalek = "2"
